<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>报告中心 · WorkBuddy</title>
<style>

:root{--bg:#f5f6fa;--card:#fff;--tx:#1f2329;--sub:#8a9099;--ln:#e6e8eb;--ac:#2b5cff;}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);
 font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;}
.wrap{max-width:960px;margin:0 auto;padding:20px 16px 60px}
h1{font-size:22px;margin:8px 0 4px}
.meta{color:var(--sub);font-size:13px;margin-bottom:14px}
.search{width:100%;padding:11px 14px;border:1px solid var(--ln);border-radius:10px;
 font-size:15px;background:var(--card);margin-bottom:18px}
.day{margin:0 0 22px}
.dh{font-size:15px;font-weight:600;margin:0 0 10px;padding:8px 12px;background:#eef1f6;
 border-radius:8px;display:flex;justify-content:space-between;align-items:center}
.dh span{font-weight:400;color:var(--sub);font-size:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px}
a.r{display:block;background:var(--card);border:1px solid var(--ln);border-radius:10px;
 padding:11px 13px;text-decoration:none;color:var(--tx);transition:.15s}
a.r:hover{border-color:var(--ac);box-shadow:0 2px 10px rgba(43,92,255,.12)}
.tag{display:inline-block;font-size:11px;color:var(--ac);background:#eef3ff;
 border-radius:4px;padding:2px 7px;margin-bottom:5px}
.tt{font-size:13.5px;line-height:1.45;word-break:break-all}
.sz{font-size:11px;color:var(--sub);margin-top:5px}
.empty{color:var(--sub);padding:30px;text-align:center}

.nav{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:0 0 14px}
.nav a.nv{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:9px;
 border:1px solid var(--ln);background:var(--card);color:var(--tx);text-decoration:none;font-size:13.5px;font-weight:600}
.nav a.nv em{font-style:normal;font-size:11px;background:#eef1f6;border-radius:20px;padding:1px 7px;color:var(--sub)}
.nav a.nv.on{background:var(--ac);border-color:var(--ac);color:#fff}
.nav a.nv.on em{background:rgba(255,255,255,.28);color:#fff}
.nav a.nv.hi{background:#0f766e;border-color:#0f766e;color:#fff}
</style></head><body><div class="wrap">
